<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恶意文件分析 - SkillHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-1: #8b5cf6;
            --brand-2: #7c3aed;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-soft: rgba(148, 163, 184, 0.2);
            --gradient-1: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            color: var(--text-main);
        }

        .header {
            background: white;
            border-bottom: 1px solid var(--border-soft);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            border-color: var(--brand-1);
            color: var(--brand-1);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
        }

        /* 上传区域 */
        .upload-section {
            background: white;
            border-radius: 16px;
            padding: 32px;
            border: 1px solid var(--border-soft);
            margin-bottom: 24px;
        }

        .upload-section h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .upload-section p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .upload-area {
            border: 2px dashed var(--border-soft);
            border-radius: 12px;
            padding: 48px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--brand-1);
            background: rgba(139, 92, 246, 0.02);
        }

        .upload-icon { font-size: 48px; margin-bottom: 16px; }
        .upload-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .upload-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; }

        .upload-formats {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .format-badge {
            padding: 4px 12px;
            background: #f1f5f9;
            border-radius: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid var(--border-soft);
        }

        .file-icon { font-size: 32px; }
        .file-details { flex: 1; }
        .file-name { font-size: 15px; font-weight: 600; }
        .file-size { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

        .file-remove {
            padding: 6px 12px;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-analyze {
            width: 100%;
            padding: 14px 24px;
            background: var(--gradient-1);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 24px;
        }

        .btn-analyze:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
        }

        .btn-analyze:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 任务列表 */
        .tasks-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-soft);
        }

        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tasks-header h2 { font-size: 18px; }

        .task-list { display: flex; flex-direction: column; gap: 12px; }

        .task-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid var(--border-soft);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .task-card:hover {
            border-color: var(--brand-1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .task-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .task-icon.pe { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); }
        .task-icon.elf { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .task-icon.mach-o { background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%); }

        .task-info { flex: 1; }
        .task-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .task-meta { display: flex; gap: 16px; font-size: 13px; color: var(--text-muted); }

        .task-status { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

        .status-badge {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.pending { background: #fef3c7; color: #92400e; }
        .status-badge.running { background: #dbeafe; color: #1e40af; }
        .status-badge.completed { background: #d1fae5; color: #065f46; }
        .status-badge.failed { background: #fee2e2; color: #991b1b; }

        .progress-bar {
            width: 100px;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-1);
            transition: width 0.3s ease;
        }

        .btn-download {
            padding: 6px 14px;
            background: var(--gradient-1);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-title { font-size: 18px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }

        .hidden { display: none !important; }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 1001;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="btn-back">← 返回首页</a>
        <h1 class="header-title">🦠 恶意文件分析</h1>
    </header>

    <main class="container">
        <!-- 上传区域 -->
        <section class="upload-section">
            <h2>上传可疑文件</h2>
            <p>支持 PE (Windows)、ELF (Linux)、Mach-O (macOS) 可执行文件，自动调用 IDA Pro 进行深度分析</p>

            <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📤</div>
                <div class="upload-title">点击或拖拽文件到此处</div>
                <div class="upload-desc">最大支持 50MB</div>
                <div class="upload-formats">
                    <span class="format-badge">.exe</span>
                    <span class="format-badge">.dll</span>
                    <span class="format-badge">.elf</span>
                    <span class="format-badge">.so</span>
                    <span class="format-badge">.dylib</span>
                </div>
            </div>

            <input type="file" id="fileInput" class="hidden" accept=".exe,.dll,.elf,.so,.bin,.app,.dylib">

            <div id="fileInfo" class="file-info hidden">
                <span class="file-icon">📄</span>
                <div class="file-details">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-size" id="fileSize"></div>
                </div>
                <button class="file-remove" onclick="clearFile()">移除</button>
            </div>

            <button class="btn-analyze" id="analyzeBtn" onclick="startAnalysis()" disabled>
                开始分析
            </button>
        </section>

        <!-- 任务列表 -->
        <section class="tasks-section">
            <div class="tasks-header">
                <h2>分析记录</h2>
            </div>
            <div class="task-list" id="taskList">
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-title">暂无分析记录</div>
                    <p>上传文件开始分析</p>
                </div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        // 单用户模式：使用固定的 default 用户
        const state = {
            userID: 'default',
            selectedFile: null,
            tasks: []
        };

        document.addEventListener('DOMContentLoaded', () => {
            setupUpload();
            loadTasks();
        });

        function setupUpload() {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });
        }

        function handleFile(file) {
            state.selectedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatSize(file.size);
            document.getElementById('fileInfo').classList.remove('hidden');
            document.getElementById('analyzeBtn').disabled = false;
        }

        function clearFile() {
            state.selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('fileInfo').classList.add('hidden');
            document.getElementById('analyzeBtn').disabled = true;
        }

        async function startAnalysis() {
            if (!state.selectedFile) return;

            const btn = document.getElementById('analyzeBtn');
            btn.disabled = true;
            btn.textContent = '上传中...';

            const formData = new FormData();
            formData.append('file', state.selectedFile);
            formData.append('agent_id', '1'); // 默认使用 ID 为 1 的 Agent

            // 记录当前使用的 userID，确保上传和轮询使用相同的 ID
            const currentUserID = state.userID;
            console.log('[Analysis] Using userID:', currentUserID);

            try {
                console.log('[Analysis] Uploading file:', state.selectedFile.name);
                const response = await fetch('/api/analysis/upload', {
                    method: 'POST',
                    headers: { 'X-User-ID': currentUserID },
                    body: formData
                });

                const result = await response.json();
                console.log('[Analysis] Upload response:', result);

                if (result.code === 0) {
                    showToast('文件已上传，正在分析...');
                    clearFile();
                    loadTasks();
                    // 轮询任务状态，使用相同的 userID
                    console.log('[Analysis] Starting poll for task:', result.data.task_id, 'with userID:', currentUserID);
                    pollTask(result.data.task_id, currentUserID);
                } else {
                    console.error('[Analysis] Upload failed:', result);
                    showToast(result.message || '上传失败');
                    btn.disabled = false;
                    btn.textContent = '开始分析';
                }
            } catch (error) {
                console.error('[Analysis] Upload error:', error);
                showToast('上传失败: ' + error.message);
                btn.disabled = false;
                btn.textContent = '开始分析';
            }
        }

        async function pollTask(taskId, userID) {
            let pollCount = 0;
            const maxPolls = 200; // 最多轮询 200 次 (10 分钟)

            // 使用传入的 userID，确保与上传时一致
            const pollUserID = userID || state.userID;

            const checkStatus = async () => {
                pollCount++;
                if (pollCount > maxPolls) {
                    showToast('轮询超时，请刷新页面查看任务状态');
                    console.error('[Analysis] Poll timeout after', maxPolls, 'attempts');
                    return;
                }

                try {
                    const response = await fetch(`/api/analysis/${taskId}`, {
                        headers: { 'X-User-ID': pollUserID }
                    });
                    const result = await response.json();
                    console.log(`[Analysis] Poll #${pollCount} status:`, result);

                    if (result.code === 0) {
                        const task = result.data;
                        loadTasks();

                        if (task.status === 'completed') {
                            showToast('分析完成！点击下载报告');
                            return;
                        } else if (task.status === 'failed') {
                            showToast('分析失败: ' + (task.error_message || '未知错误'));
                            console.error('[Analysis] Task failed:', task.error_message);
                            return;
                        } else if (task.status === 'running' || task.status === 'pending') {
                            // 显示进度
                            if (task.progress > 0) {
                                console.log(`[Analysis] Progress: ${task.progress}%`);
                            }
                            setTimeout(checkStatus, 3000);
                        } else {
                            showToast('任务状态异常: ' + task.status);
                        }
                    } else {
                        console.error('[Analysis] API error:', result);
                        showToast('查询任务状态失败: ' + result.message);
                    }
                } catch (e) {
                    console.error('[Analysis] Poll error:', e);
                    // 继续轮询，可能是临时网络问题
                    setTimeout(checkStatus, 5000);
                }
            };
            checkStatus();
        }

        async function loadTasks() {
            try {
                const response = await fetch('/api/analysis/tasks', {
                    headers: { 'X-User-ID': state.userID }
                });
                const result = await response.json();
                if (result.code === 0) {
                    state.tasks = result.data.tasks || [];
                    renderTasks();
                }
            } catch (error) {
                console.error('Load tasks error:', error);
            }
        }

        function renderTasks() {
            const container = document.getElementById('taskList');

            if (state.tasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div class="empty-title">暂无分析记录</div>
                        <p>上传文件开始分析</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = state.tasks.map(task => `
                <div class="task-card">
                    <div class="task-icon ${task.file_type.toLowerCase().replace('-', '')}">
                        ${getFileIcon(task.file_type)}
                    </div>
                    <div class="task-info">
                        <div class="task-name">${escapeHtml(task.file_name)}</div>
                        <div class="task-meta">
                            <span>${task.file_type}</span>
                            <span>${formatSize(task.file_size)}</span>
                            <span>${formatDate(task.created_at)}</span>
                        </div>
                    </div>
                    <div class="task-status">
                        <span class="status-badge ${task.status}">${getStatusText(task.status)}</span>
                        ${task.status === 'running' ? `
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${task.progress || 0}%"></div>
                            </div>
                        ` : ''}
                        ${task.status === 'completed' ? `
                            <button class="btn-download" onclick="downloadReport(${task.id})">下载报告</button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function downloadReport(taskId) {
            console.log('Downloading report for task:', taskId, 'User:', state.userID);
            showToast('正在下载报告...');

            fetch(`/api/analysis/${taskId}/download`, {
                headers: { 'X-User-ID': state.userID }
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error('下载失败: ' + response.status + ' - ' + text);
                    });
                }
                return response.blob();
            })
            .then(blob => {
                if (blob.size === 0) throw new Error('文件内容为空');
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `analysis_report_${taskId}.zip`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                a.remove();
                showToast('报告下载完成！');
            })
            .catch(err => {
                console.error('Download error:', err);
                showToast('下载失败：' + err.message);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function getStatusText(status) {
            return { 'pending': '等待中', 'running': '分析中', 'completed': '已完成', 'failed': '失败' }[status] || status;
        }

        function getFileIcon(type) {
            return { 'PE': '🪟', 'ELF': '🐧', 'Mach-O': '🍎' }[type] || '📄';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 定时刷新
        setInterval(loadTasks, 10000);
    </script>
</body>
</html>
