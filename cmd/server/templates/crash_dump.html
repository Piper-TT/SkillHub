<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>崩溃转储分析 - SkillHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-1: #f59e0b;
            --brand-2: #d97706;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-soft: rgba(148, 163, 184, 0.2);
            --gradient-1: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            color: var(--text-main);
        }

        .header {
            background: white;
            border-bottom: 1px solid var(--border-soft);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            border-color: var(--brand-1);
            color: var(--brand-1);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
        }

        /* 上传区域 */
        .upload-section {
            background: white;
            border-radius: 16px;
            padding: 32px;
            border: 1px solid var(--border-soft);
            margin-bottom: 24px;
        }

        .upload-section h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .upload-section p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .upload-area {
            border: 2px dashed var(--border-soft);
            border-radius: 12px;
            padding: 48px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--brand-1);
            background: rgba(245, 158, 11, 0.02);
        }

        .upload-icon { font-size: 48px; margin-bottom: 16px; }
        .upload-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .upload-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; }

        .upload-formats {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .format-badge {
            padding: 4px 12px;
            background: #f1f5f9;
            border-radius: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid var(--border-soft);
        }

        .file-icon { font-size: 32px; }
        .file-details { flex: 1; }
        .file-name { font-size: 15px; font-weight: 600; }
        .file-size { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

        .file-remove {
            padding: 6px 12px;
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-analyze {
            width: 100%;
            padding: 14px 24px;
            background: var(--gradient-1);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 24px;
        }

        .btn-analyze:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.3);
        }

        .btn-analyze:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 任务列表 */
        .tasks-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-soft);
        }

        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tasks-header h2 { font-size: 18px; }

        .task-list { display: flex; flex-direction: column; gap: 12px; }

        .task-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid var(--border-soft);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .task-card:hover {
            border-color: var(--brand-1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .task-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .task-icon.dmp { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .task-icon.vmcore { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }

        .task-info { flex: 1; }
        .task-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .task-meta { display: flex; gap: 16px; font-size: 13px; color: var(--text-muted); }

        .task-status { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

        .status-badge {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.pending { background: #fef3c7; color: #92400e; }
        .status-badge.running { background: #dbeafe; color: #1e40af; }
        .status-badge.completed { background: #d1fae5; color: #065f46; }
        .status-badge.failed { background: #fee2e2; color: #991b1b; }

        .progress-bar {
            width: 100px;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-1);
            transition: width 0.3s ease;
        }

        .btn-download {
            padding: 6px 14px;
            background: var(--gradient-1);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-title { font-size: 18px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }

        .hidden { display: none !important; }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 1001;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/agent" class="btn-back">← 返回</a>
        <h1 class="header-title">💊 崩溃转储分析</h1>
    </header>

    <main class="container">
        <!-- 上传区域 -->
        <section class="upload-section">
            <h2>上传崩溃转储文件</h2>
            <p>支持 Windows 内存转储 (.dmp/.mdmp/.hdmp) 和 Linux 内核转储 (vmcore) 文件分析</p>

            <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📤</div>
                <div class="upload-title">点击或拖拽文件到此处</div>
                <div class="upload-desc">最大支持 200MB</div>
                <div class="upload-formats">
                    <span class="format-badge">.dmp</span>
                    <span class="format-badge">.mdmp</span>
                    <span class="format-badge">.hdmp</span>
                    <span class="format-badge">vmcore</span>
                </div>
            </div>

            <input type="file" id="fileInput" class="hidden">

            <div id="fileInfo" class="file-info hidden">
                <span class="file-icon">📄</span>
                <div class="file-details">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-size" id="fileSize"></div>
                </div>
                <button class="file-remove" onclick="clearFile()">移除</button>
            </div>

            <button class="btn-analyze" id="analyzeBtn" onclick="startAnalysis()" disabled>
                开始分析
            </button>
        </section>

        <!-- 任务列表 -->
        <section class="tasks-section">
            <div class="tasks-header">
                <h2>分析记录</h2>
            </div>
            <div class="task-list" id="taskList">
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-title">暂无分析记录</div>
                    <p>上传转储文件开始分析</p>
                </div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        const state = {
            userID: 'default',
            selectedFile: null,
            tasks: []
        };

        document.addEventListener('DOMContentLoaded', () => {
            setupUpload();
            loadTasks();
        });

        function setupUpload() {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });
        }

        function handleFile(file) {
            state.selectedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatSize(file.size);
            document.getElementById('fileInfo').classList.remove('hidden');
            document.getElementById('analyzeBtn').disabled = false;
        }

        function clearFile() {
            state.selectedFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('fileInfo').classList.add('hidden');
            document.getElementById('analyzeBtn').disabled = true;
        }

        async function startAnalysis() {
            if (!state.selectedFile) return;

            showToast('功能开发中，敬请期待');

            // TODO: 实现上传和分析逻辑
            // const formData = new FormData();
            // formData.append('file', state.selectedFile);
            // const response = await fetch('/api/crash-dump/upload', {
            //     method: 'POST',
            //     headers: { 'X-User-ID': state.userID },
            //     body: formData
            // });
        }

        async function loadTasks() {
            // TODO: 实现任务列表加载
            // const response = await fetch('/api/crash-dump/tasks', {
            //     headers: { 'X-User-ID': state.userID }
            // });
        }

        function renderTasks() {
            const container = document.getElementById('taskList');

            if (state.tasks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div class="empty-title">暂无分析记录</div>
                        <p>上传转储文件开始分析</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = state.tasks.map(task => `
                <div class="task-card">
                    <div class="task-icon ${getFileTypeClass(task.file_name)}">
                        ${getFileIcon(task.file_name)}
                    </div>
                    <div class="task-info">
                        <div class="task-name">${escapeHtml(task.file_name)}</div>
                        <div class="task-meta">
                            <span>${formatSize(task.file_size)}</span>
                            <span>${formatDate(task.created_at)}</span>
                        </div>
                    </div>
                    <div class="task-status">
                        <span class="status-badge ${task.status}">${getStatusText(task.status)}</span>
                        ${task.status === 'running' ? `
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${task.progress || 0}%"></div>
                            </div>
                        ` : ''}
                        ${task.status === 'completed' ? `
                            <button class="btn-download" onclick="downloadReport(${task.id})">下载报告</button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function downloadReport(taskId) {
            showToast('功能开发中，敬请期待');
            // TODO: 实现报告下载
            // fetch(`/api/crash-dump/${taskId}/download`, { headers: { 'X-User-ID': state.userID } })
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }

        function getStatusText(status) {
            return { 'pending': '等待中', 'running': '分析中', 'completed': '已完成', 'failed': '失败' }[status] || status;
        }

        function getFileTypeClass(fileName) {
            if (!fileName) return 'dmp';
            const lower = fileName.toLowerCase();
            if (lower.includes('vmcore')) return 'vmcore';
            return 'dmp';
        }

        function getFileIcon(fileName) {
            if (!fileName) return '📄';
            const lower = fileName.toLowerCase();
            if (lower.includes('vmcore')) return '🐧';
            return '🪟';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
