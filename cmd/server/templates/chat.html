<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天 - AgentHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-1: #8b5cf6;
            --brand-2: #7c3aed;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-soft: rgba(148, 163, 184, 0.2);
            --gradient-1: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: white;
            border-bottom: 1px solid var(--border-soft);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            border-color: var(--brand-1);
            color: var(--brand-1);
        }

        .agent-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .agent-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .agent-name { font-size: 16px; font-weight: 600; }
        .agent-category { font-size: 13px; color: var(--text-muted); }

        .chat-container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            overflow-y: auto;
        }

        .messages { display: flex; flex-direction: column; gap: 16px; }

        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .message-avatar { background: var(--gradient-1); }
        .message.assistant .message-avatar { background: #e2e8f0; }
        .message.system .message-avatar { background: #fef3c7; }

        .message-content {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 14px 18px;
            border: 1px solid var(--border-soft);
            line-height: 1.6;
            font-size: 14px;
            word-break: break-word;
        }

        .message.user .message-content {
            background: var(--gradient-1);
            color: white;
            border: none;
        }

        .message.system .message-content {
            background: #fffbeb;
            border-color: #fde68a;
        }

        .message-content pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 12px 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            font-size: 13px;
        }

        .message-content code {
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .message.user .message-content code {
            background: rgba(255, 255, 255, 0.2);
        }

        .chat-input-container {
            background: white;
            border-top: 1px solid var(--border-soft);
            padding: 20px 24px;
            position: sticky;
            bottom: 0;
        }

        .chat-input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--brand-1);
        }

        .btn-send {
            padding: 14px 24px;
            background: var(--gradient-1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-send:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background: var(--brand-1);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .typing-status {
            font-size: 13px;
            color: var(--text-muted);
        }

        .tool-call-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--brand-1);
            background: rgba(139, 92, 246, 0.08);
            padding: 4px 10px;
            border-radius: 6px;
            margin-top: 6px;
        }

        .tool-call-badge .spinner {
            width: 12px;
            height: 12px;
            border: 2px solid rgba(139, 92, 246, 0.2);
            border-top-color: var(--brand-1);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .tool-call-badge.done .spinner {
            display: none;
        }

        .tool-call-badge.done::before {
            content: '✓';
            color: #22c55e;
            font-weight: bold;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin: 16px 0;
        }

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .welcome-icon { font-size: 48px; margin-bottom: 16px; }
        .welcome-title { font-size: 20px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
        .welcome-desc { font-size: 14px; max-width: 400px; margin: 0 auto; }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 400px;
            color: var(--text-muted);
        }

        .empty-state-icon { font-size: 64px; margin-bottom: 20px; }
        .empty-state-title { font-size: 20px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1001;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <header class="chat-header">
        <a href="/agent" class="btn-back">← 返回</a>
        <div class="agent-info">
            <div class="agent-icon" id="agentIcon">🤖</div>
            <div>
                <div class="agent-name" id="agentName">加载中...</div>
                <div class="agent-category" id="agentCategory">-</div>
            </div>
        </div>
        <div id="vulnVersionBadge" style="display: none; padding: 6px 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 20px; font-size: 13px; font-weight: 500; margin-left: auto;">
            🗄️ 漏洞库: <span id="vulnVersion">-</span>
        </div>
        <button class="btn-upload-file" id="uploadFileBtn" style="display: none; padding: 8px 16px; background: var(--gradient-1); color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer;" onclick="window.location.href='/analysis'">
            📤 上传文件分析
        </button>
        <button id="clearBtn" style="padding: 8px 16px; background: #fee2e2; border: none; border-radius: 8px; font-size: 14px; color: #dc2626; font-weight: 600; cursor: pointer; transition: all 0.2s ease;" onmouseover="this.style.background='#fecaca'" onmouseout="this.style.background='#fee2e2'" onclick="clearChat()">
            🗑 清空对话
        </button>
    </header>

    <main class="chat-container">
        <div class="messages" id="messages">
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <div class="empty-state-title">开始对话</div>
                <p>输入消息开始与智能体对话</p>
            </div>
        </div>
    </main>

    <footer class="chat-input-container">
        <div class="chat-input-wrapper">
            <textarea
                class="chat-input"
                id="chatInput"
                placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"
                rows="1"
            ></textarea>
            <button class="btn-send" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        const state = {
            agentId: null,
            agent: null,
            sessionId: null,
            messages: [],
            isStreaming: false
        };

        // 从 URL 获取 agent ID
        const pathParts = window.location.pathname.split('/');
        state.agentId = parseInt(pathParts[2]);

        // 单用户模式：使用固定的 default 用户
        const userID = 'default';

        document.addEventListener('DOMContentLoaded', () => {
            loadAgent();
            setupInput();
        });

        // 页面加载时恢复历史会话
        async function restoreSession() {
            const savedSessionId = localStorage.getItem(`session_agent_${state.agentId}`);
            if (!savedSessionId) return false;

            try {
                const resp = await fetch(`/api/session/${savedSessionId}`, {
                    headers: { 'X-User-ID': userID }
                });
                if (!resp.ok) {
                    localStorage.removeItem(`session_agent_${state.agentId}`);
                    return false;
                }

                const data = await resp.json();
                const msgs = data.messages || [];
                if (msgs.length === 0) return false;

                // 清除空状态
                const container = document.getElementById('messages');
                container.innerHTML = '';

                // 渲染历史消息
                for (const msg of msgs) {
                    if (msg.role === 'user') {
                        addUserMessage(msg.content);
                    } else if (msg.role === 'assistant') {
                        addAssistantMessage(msg.content);
                        // 移除 current-response ID，防止后续冲突
                        const cur = document.getElementById('current-response');
                        if (cur) cur.removeAttribute('id');
                    }
                }

                state.sessionId = parseInt(savedSessionId);
                scrollToBottom();
                return true;
            } catch (e) {
                console.log('恢复会话失败:', e);
                return false;
            }
        }

        async function loadAgent() {
            try {
                const response = await fetch(`/api/agent/${state.agentId}`);
                if (!response.ok) {
                    showToast('智能体不存在');
                    return;
                }

                state.agent = await response.json();

                document.getElementById('agentIcon').textContent = state.agent.icon || '🤖';
                document.getElementById('agentName').textContent = state.agent.name;
                document.getElementById('agentCategory').textContent = state.agent.category || 'Other';

                // 如果是恶意文件分析助手，显示上传按钮
                if (state.agent.slug === 'malware-analyzer') {
                    document.getElementById('uploadFileBtn').style.display = 'block';
                }

                // 如果是漏洞补丁查询助手，显示漏洞库版本号
                if (state.agent.slug === 'cve-patch-analyzer') {
                    loadVulnVersion();
                }

                // 尝试恢复历史会话，如果没有则显示欢迎消息
                const restored = await restoreSession();
                if (!restored) {
                    showWelcomeMessage();
                }

            } catch (error) {
                console.error('Failed to load agent:', error);
                showToast('加载失败');
            }
        }

        // 加载漏洞库版本号并显示
        async function loadVulnVersion() {
            try {
                const resp = await fetch('/api/vuln/status');
                if (!resp.ok) return;
                const data = await resp.json();
                if (data.vuln_version) {
                    document.getElementById('vulnVersion').textContent = data.vuln_version;
                    document.getElementById('vulnVersionBadge').style.display = 'block';
                }
            } catch (e) {
                console.error('Failed to load vuln version:', e);
            }
        }

        function setupInput() {
            const input = document.getElementById('chatInput');

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // 自动调整高度
            input.addEventListener('input', () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 150) + 'px';
            });
        }

        function showWelcomeMessage() {
            const agent = state.agent;
            const desc = agent.description ? agent.description.trim() : '';
            const intro = desc ? `：${desc}` : '';
            addSystemMessage(`你好！我是 ${agent.name}${intro}。\n\n请问有什么可以帮助你的？`);
        }

        function addSystemMessage(content) {
            const messages = document.getElementById('messages');

            // 清除空状态
            if (messages.querySelector('.empty-state')) {
                messages.innerHTML = '';
            }

            const div = document.createElement('div');
            div.className = 'message system';
            div.innerHTML = `
                <div class="message-avatar">ℹ️</div>
                <div class="message-content">${formatContent(content)}</div>
            `;
            messages.appendChild(div);
            scrollToBottom();
        }

        function addUserMessage(content) {
            const messages = document.getElementById('messages');

            const div = document.createElement('div');
            div.className = 'message user';
            div.innerHTML = `
                <div class="message-avatar">👤</div>
                <div class="message-content">${formatContent(content)}</div>
            `;
            messages.appendChild(div);
            scrollToBottom();
        }

        function addAssistantMessage(content) {
            const messages = document.getElementById('messages');

            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'current-response';
            div.innerHTML = `
                <div class="message-avatar">${state.agent?.icon || '🤖'}</div>
                <div class="message-content">${formatContent(content)}</div>
            `;
            messages.appendChild(div);
            scrollToBottom();
            return div;
        }

        // 累积的助手响应内容
        let accumulatedContent = '';

        function appendToAssistantMessage(content) {
            const div = document.getElementById('current-response');
            if (div) {
                accumulatedContent += content;
                const contentEl = div.querySelector('.message-content');
                contentEl.innerHTML = formatContent(accumulatedContent);
                scrollToBottom();
            }
        }

        function addTypingIndicator(statusText) {
            const messages = document.getElementById('messages');

            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typing-indicator';
            div.innerHTML = `
                <div class="message-avatar">${state.agent?.icon || '🤖'}</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                        <span class="typing-status">${statusText || '思考中...'}</span>
                    </div>
                    <div id="tool-call-list"></div>
                </div>
            `;
            messages.appendChild(div);
            scrollToBottom();
        }

        function updateTypingStatus(text) {
            const el = document.querySelector('#typing-indicator .typing-status');
            if (el) { el.textContent = text; scrollToBottom(); }
        }

        function addToolCallBadge(name) {
            const list = document.getElementById('tool-call-list');
            if (!list) return;
            const badge = document.createElement('div');
            badge.className = 'tool-call-badge';
            badge.id = 'tool-' + name;
            badge.innerHTML = `<div class="spinner"></div> 调用工具: ${name}`;
            list.appendChild(badge);
            scrollToBottom();
        }

        function markToolCallDone(name) {
            const badge = document.getElementById('tool-' + name);
            if (badge) {
                badge.className = 'tool-call-badge done';
                badge.innerHTML = name;
                scrollToBottom();
            }
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }

        async function clearChat() {
            if (state.isStreaming) return;
            if (!confirm('确定要清空当前对话吗？')) return;

            // 删除服务端会话
            if (state.sessionId) {
                try {
                    await fetch(`/api/session/${state.sessionId}`, {
                        method: 'DELETE',
                        headers: { 'X-User-ID': userID }
                    });
                } catch (e) {}
            }

            // 清除本地状态
            state.sessionId = null;
            state.messages = [];
            accumulatedContent = '';
            localStorage.removeItem(`session_agent_${state.agentId}`);

            // 重置 UI
            const container = document.getElementById('messages');
            container.innerHTML = '';
            showWelcomeMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();

            if (!message || state.isStreaming) return;

            // 添加用户消息
            addUserMessage(message);
            input.value = '';
            input.style.height = 'auto';

            // 禁用发送按钮
            state.isStreaming = true;
            sendBtn.disabled = true;
            sendBtn.textContent = '生成中...';

            // 显示打字指示器
            addTypingIndicator();

            // 重置消息状态
            state.messages = [];
            accumulatedContent = '';  // 重置累积内容

            try {
                const response = await fetch(`/api/agent/${state.agentId}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-ID': userID
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: state.sessionId
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || '请求失败');
                }

                // 处理 SSE 流式响应（typing indicator 在收到第一条内容时再移除）
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let currentEvent = '';

                while (true) {
                    // 5 分钟超时保护，防止流永远不关闭
                    const readResult = await Promise.race([
                        reader.read(),
                        new Promise((_, reject) => setTimeout(() => reject(new Error('响应超时')), 300000))
                    ]);
                    const { done, value } = readResult;
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');

                    // 保留最后一个不完整的行
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        // 解析事件类型
                        if (line.startsWith('event:')) {
                            currentEvent = line.slice(6).trim();
                            continue;
                        }

                        if (!line.startsWith('data:')) {
                            currentEvent = '';
                            continue;
                        }

                        try {
                            const dataStr = line.startsWith('data: ') ? line.slice(6) : line.slice(5);
                            const data = JSON.parse(dataStr);

                            switch (currentEvent) {
                                case 'status':
                                    // 更新状态文字
                                    updateTypingStatus(data.message || '处理中...');
                                    break;

                                case 'tool_call':
                                    if (data.status === 'completed') {
                                        markToolCallDone(data.name);
                                    } else {
                                        addToolCallBadge(data.name);
                                    }
                                    break;

                                case 'message':
                                    if (data.content) {
                                        // 首次收到内容，移除 typing indicator 并创建消息容器
                                        if (document.getElementById('typing-indicator')) {
                                            removeTypingIndicator();
                                            accumulatedContent = '';
                                            addAssistantMessage('');
                                        }
                                        appendToAssistantMessage(data.content);
                                    }
                                    break;

                                case 'done':
                                    // 完成时，移除 current-response ID
                                    (function() {
                                        var el = document.getElementById('current-response');
                                        if (el) el.removeAttribute('id');
                                    })();
                                    state.sessionId = data.session_id;
                                    if (data.session_id) {
                                        localStorage.setItem(`session_agent_${state.agentId}`, data.session_id);
                                    }
                                    break;

                                case 'error':
                                    throw new Error(data.message || '请求失败');
                            }
                        } catch (e) {
                            if (e.message && !e.message.includes('JSON')) throw e;
                        }

                        currentEvent = '';
                    }
                }

            } catch (error) {
                removeTypingIndicator();
                // 如果还没创建助手消息，显示错误
                if (!document.getElementById('current-response')) {
                    addSystemMessage('❌ 错误: ' + error.message);
                }
            } finally {
                // 确保清理：移除可能残留的 typing indicator
                removeTypingIndicator();
                // 清理 current-response 的 ID，防止下次冲突
                const cur = document.getElementById('current-response');
                if (cur) cur.removeAttribute('id');
                state.isStreaming = false;
                sendBtn.disabled = false;
                sendBtn.textContent = '发送';
            }
        }

        function scrollToBottom() {
            const container = document.querySelector('.chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function formatContent(content) {
            // 简单的 Markdown 渲染
            let html = escapeHtml(content);

            // 代码块
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');

            // 行内代码
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // 粗体
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            // 换行
            html = html.replace(/\n/g, '<br>');

            return html;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
