server:
  port: 18089
  upload_dir: ./uploads
  max_upload_size: 104857600  # 100MB

database:
  type: sqlite
  path: ./skills.db

security:
  allowed_extensions:
    - .zip
    - .tar.gz
    - .tgz
  max_filename_length: 255

logging:
  level: info
  format: console  # console or json

kernel:
  service_url: "http://localhost:8081"  # kernel-build 服务地址

ti:
  service_url: "http://localhost:8080"  # tiserver 威胁情报服务地址

analysis:
  idalib_path: "C:\\Users\\tt\\AppData\\Local\\Programs\\Python\\Python314\\Scripts\\idalib-mcp.exe"  # idalib-mcp.exe 路径

tinyclaw:
  download_url: "http://10.50.6.49/edr/tinyclaw"
  rpcserver_win_url: "iwr -useb http://10.50.6.49/edr/tinyclaw/install_rpc.ps1 | iex"
  rpcserver_linux_url: "curl -fsSL http://10.50.6.49/edr/tinyclaw/install_rpc.sh | sudo bash"
  tinyclaw_win_url: "iwr -useb http://10.50.6.49/edr/tinyclaw/install.ps1 | iex"
  tinyclaw_linux_url: "curl -fsSL http://10.50.6.49/edr/tinyclaw/install.sh | sudo bash"
  skill_download_cmd: "curl -L -o tinyclawskill.zip http://10.50.6.49/edr/tinyclaw/tinyclawskill.zip"
  skill_prompt: "安装 TinyClawCLI 安全技能，连接本地 TinyClaw 服务"
